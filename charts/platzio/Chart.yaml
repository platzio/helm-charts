apiVersion: v2
appVersion: "0.7.0-beta.5"
version: "0.7.0-beta.5"
description: A Helm chart for Platz.io
name: platzio
type: application
keywords:
  - helm
  - chart
  - cd
  - continuous deployment
icon: https://raw.githubusercontent.com/platzio/design/main/assets/Logo.svg
sources:
  - https://github.com/platzio

annotations:
  artifacthub.io/prerelease: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: "Dependency refresh across backend, chart-ext, sdk-rs, sdk-js, sdk-py, frontend, base-image (cargo update / npm patches / GitHub Actions normalized to checkout v6, login v4, buildx v4, build-push v7)"
    - kind: changed
      description: "Backend workspace member crates inherit version from [workspace.package], so release version now propagates into OpenAPI info.version (was stuck at 0.1.0)"
    - kind: added
      description: "chart-discovery OCI registry provider (provider=oci, PLATZ_OCI_REGISTRY_URL, PLATZ_OCI_POLL_INTERVAL)"
    - kind: added
      description: "k8s-agent local cluster provider (provider=local, localContext, localKubeconfig, disableDeploymentCredentials)"
    - kind: added
      description: "Configurable database connection pool (database.pool.maxSize / minIdle / connectionTimeoutSecs / idleTimeoutSecs / maxLifetimeSecs)"
    - kind: added
      description: "extraEnv on api, chart-discovery, k8s-agent, resource-sync, status-updates"
    - kind: added
      description: "Configurable k8s-agent deployment credentials cadence (deploymentCredentialsRefreshInterval, deploymentCredentialsTokenDuration / PLATZ_DEPLOYMENT_CREDENTIALS_REFRESH_INTERVAL, PLATZ_DEPLOYMENT_CREDENTIALS_TOKEN_DURATION)"
    - kind: fixed
      description: "resource-sync now honors resourceSync.replicaCount instead of a missing top-level replicaCount"
    - kind: changed
      description: "k8s-agent deployment credential refresh no longer aborts the batch on the first failing deployment"
    - kind: fixed
      description: "Outbound TLS no longer panics on first use: api, chart-discovery, status-updates install a default rustls crypto provider"
    - kind: fixed
      description: "bots create/delete are exposed in the OpenAPI schema and generated SDKs again (NewBot, createBot, deleteBot)"
    - kind: changed
      description: "backend chart-ext dependency bumped to 0.7.1 (utoipa 5, juspay_jsonlogic)"
