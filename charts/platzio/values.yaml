images:
  frontend:
    repository: platzio/frontend
    tag: v0.7.0-beta.2
    pullPolicy: IfNotPresent
  backend:
    repository: platzio/backend
    tag: v0.7.0-beta.2
    pullPolicy: IfNotPresent
  helm:
    repository: platzio/base
    tag: v9

auth:
  adminEmails: []
  oidc:
    serverUrl:
      valueFrom:
        secretKeyRef:
          name: oidc-config
          key: serverUrl
    clientId:
      valueFrom:
        secretKeyRef:
          name: oidc-config
          key: clientId
    clientSecret:
      valueFrom:
        secretKeyRef:
          name: oidc-config
          key: clientSecret

api:
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 512Mi
  replicaCount: 1
  serviceAccount:
    name: platz-api
    annotations: {}
  service:
    type: ClusterIP
    port: 80
    containerPort: 3000
  # Extra environment variables to inject into the api container.
  # Each entry is a standard k8s EnvVar struct (`name` + `value` or `valueFrom`).
  extraEnv: []

chartDiscovery:
  instances:
    - name: default
      enableTagParser: false
      # Provider selects the discovery backend: "ecr" (default — watch SQS) or
      # "oci" (poll a generic OCI registry such as Docker Distribution / zot).
      provider: ecr
      ecrEvents:
        queueName: ""
        regionName: ""
      oci:
        # Base URL of the OCI registry to poll, e.g. http://registry.platz.svc.cluster.local:5000
        registryUrl: ""
        pollInterval: 5s
      serviceAccount:
        name: ""
        annotations: {}
      # Extra environment variables to inject into this chart-discovery instance.
      extraEnv: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

resourceSync:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  replicaCount: 1
  serviceAccount:
    name: platz-resource-sync
    annotations: {}
  extraEnv: []

statusUpdates:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  replicaCount: 1
  serviceAccount:
    name: platz-status-updates
    annotations: {}
  extraEnv: []

k8sAgent:
  instances:
    - name: default
      # Provider selects the cluster discovery mode: "eks" (default — scan AWS) or
      # "local" (register a single cluster from a kubeconfig context).
      provider: eks
      # When provider=local, the kubeconfig context to register. Defaults to the
      # kubeconfig's current-context if empty.
      localContext: ""
      # When provider=local, optional path to a kubeconfig file inside the pod.
      # Defaults to the kubectl default (~/.kube/config) when empty. Usually paired
      # with a Secret/ConfigMap mount via extraEnv/volumes.
      localKubeconfig: ""
      # When true, k8s-agent does not provision per-deployment credentials.
      # Use in local/dev setups where the helm pod runs against a single cluster
      # with ambient credentials.
      disableDeploymentCredentials: false
      # How often k8s-agent refreshes per-deployment credentials. Accepts a
      # humantime duration (e.g. "20m", "1h"). Empty falls back to the binary
      # default ("20m").
      deploymentCredentialsRefreshInterval: ""
      # Lifetime of issued deployment credential tokens. Accepts a humantime
      # duration (e.g. "1h", "30m"). Empty falls back to the binary default
      # ("1h").
      deploymentCredentialsTokenDuration: ""
      serviceAccount:
        name: ""
        annotations: {}
      # Extra environment variables to inject into this k8s-agent instance.
      extraEnv: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1Gi

frontend:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
    containerPort: 80
  serviceAccount:
    name: platz-frontend
    annotations: {}

backupJob:
  enabled: false
  config:
    bucketName: ""
    bucketRegion: ""
    bucketPrefix: ""
    encryptionKeyValueFrom:
      secretKeyRef:
        name: backup-config
        key: encryptionKey
  image:
    repository: popen2/postgres-backup-s3
    tag: v17.5
  serviceAccount:
    name: platz-backup
    annotations: {}

database:
  secretName: postgres-creds
  # Connection pool tuning. Each setting maps to a DB_POOL_* env var read by every
  # Platz pod that opens the database (api, chart-discovery, k8s-agent, resource-sync,
  # status-updates). Leave blank to use the built-in defaults: maxSize=50,
  # connectionTimeoutSecs=30, idleTimeoutSecs=600, maxLifetimeSecs=1800.
  pool:
    maxSize: ""
    minIdle: ""
    connectionTimeoutSecs: ""
    idleTimeoutSecs: ""
    maxLifetimeSecs: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
ownUrlOverride: ""

podAnnotations: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

ingress:
  enabled: false
  className: ""
  annotations: {}
  rules:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

certManager:
  certificate:
    create: false
  issuer:
    create: false
    name: ""
    email: ""
    kind: Issuer
    group: cert-manager.io

nodeSelector: {}

tolerations: []

affinity: {}
